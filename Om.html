<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma ShardaLodge | Rooms & Rates</title>
    <link rel="stylesheet" href="Om.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="lodge-card">
        <header class="lodge-header">
            <div class="header-image">
                <img
                    src="Om Lodge.jpg"
                    alt="Om Lodge"
                >
            </div>
            <div class="lodge-title">

                <h1>Om Lodge</h1>

                <div class="sub">

                    <span>
                        <i class="fas fa-user-tie"></i>
                        Devendra Yadav
                    </span>

                    <span>
                        <i class="fas fa-phone-alt"></i>
                        9336979184,9151457000
                    </span>

                </div>

            </div>
            <div class="owner-badge">

                <i class="fas fa-id-card"></i>

                <span>
                    Owner: Devendra Yadav
                </span>

            </div>

        </header>
        <section class="lodge-content">

            <div class="section-title">

                <i class="fas fa-bed"></i>

                <span>Rooms</span>

            </div>
            <div class="room-grid">
                <article
                    class="room-card"
                    data-room="single"
                >

                    <div class="room-type">

                        <h3>
                            <i class="fas fa-user"></i>
                            Single
                        </h3>

                        <div class="price-tag">
                            ₹1,500
                            <small>/ monthll>
                        </div>

                    </div>


                    <div class="room-details">

                        <div class="detail-group">

                            <span class="detail-item">
                                <i class="fas fa-bolt"></i>
                                Inverter: Bulb
                            </span>

                            <span class="detail-item">
                                <i class="fas fa-lightbulb"></i>
                                Light: Bulb & Fan
                            </span>

                        </div>

                    </div>

                      </div>
        </section>
    </main>
    <script src="Om.js"></script>
</body>
</html>
