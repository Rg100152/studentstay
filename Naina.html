<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naina Lodge | Rooms & Rates</title>
    <link rel="stylesheet" href="Naina.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="lodge-card">
        <header class="lodge-header">
            <div class="header-image">
                <img
                    src="Naina Lodge.jpg"
                    alt="Naina Lodge"
                >
            </div>
            <div class="lodge-title">

                <h1>Naina Lodge</h1>

                <div class="sub">

                    <span>
                        <i class="fas fa-user-tie"></i>
                        Ramkumar Prajapati
                    </span>

                    <span>
                        <i class="fas fa-phone-alt"></i>
                        9795896165
                    </span>

                </div>

            </div>
            <div class="owner-badge">

                <i class="fas fa-id-card"></i>

                <span>
                    Owner: Ramkumar Prajapati
                </span>

            </div>

        </header>
        <section class="lodge-content">

            <div class="section-title">

                <i class="fas fa-bed"></i>

                <span>Rooms & Tariff</span>

            </div>
            <div class="room-grid">
                <article
                    class="room-card"
                    data-room="single"
                >

                    <div class="room-type">

                        <h3>
                            <i class="fas fa-user"></i>
                            Single
                        </h3>

                        <div class="price-tag">
                            ₹1,700
                            <small>/ month</small>
                        </div>

                    </div>


                    <div class="room-details">

                        <div class="detail-group">

                            <span class="detail-item">
                                <i class="fas fa-bolt"></i>
                                Inverter: Bulb
                            </span>

                            <span class="detail-item">
                                <i class="fas fa-lightbulb"></i>
                                Light: Bulb & Fan
                            </span>

                        </div>

                    </div>

                </article>

                <article
                    class="room-card"
                    data-room="double"
                >

                    <div class="room-type">

                        <h3>
                            <i class="fas fa-user-friends"></i>
                            Double
                        </h3>

                        <div class="price-tag">
                            ₹2,000
                            <small>/ month</small>
                        </div>

                    </div>


                    <div class="room-details">

                        <div class="detail-group">

                            <span class="detail-item">
                                <i class="fas fa-bolt"></i>
                                Inverter: Bulb
                            </span>

                            <span class="detail-item">
                                <i class="fas fa-lightbulb"></i>
                                Light: Bulb & Fan
                            </span>

                        </div>

                    </div>

                </article>


                <article
                    class="room-card"
                    data-room="Flat"
                >

                    <div class="room-type">

                        <h3>
                            <i class="fas fa-home"></i>
                            Flat
                        </h3>

                        <div class="price-tag">
                            ₹3,000
                            <small>/ month</small>
                        </div>

                    </div>


                    <div class="room-details">

                        <div class="detail-group">

                            <span class="detail-item">
                                <i class="fas fa-bolt"></i>
                                Inverter: Bulb & Fan
                            </span>

                            <span class="detail-item">
                                <i class="fas fa-lightbulb"></i>
                                Light: Bulb & Fan
                            </span>

                            <span class="flat-extra">
                                <i class="fas fa-door-open"></i>
                                Two rooms · Kitchen · Attached bathroom
                            </span>

                        </div>

                    </div>

                </article>

            </div>

        </section>


 
       
       

    </main>


    
    <script src="Naina.js"></script>

</body>
</html>
