<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="slogin.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <img src="studentstay-logo.png" alt="Student Stay Lodge logo">
                <div>
                    <strong>Student<span>Stay</span></strong>
                    <small>Find Your Perfect Lodge</small>
                </div>
            </div>

            <h1>Student Login</h1>

            <p class="subtitle">Login to find your perfect lodge</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="studentName">Student Name:</label>
                    <input 
                        type="text" 
                        id="studentName" 
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="rollNumber">Roll Number:</label>
                    <input 
                        type="text" 
                        id="rollNumber" 
                        placeholder="Enter your roll number"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password:</label>

                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>

    <script src="slogin.js"></script>

</body>
</html>
